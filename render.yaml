# Render Blueprint: сайт + база одной кнопкой (Dashboard → New → Blueprint → этот репозиторий)
services:
  - type: web
    name: timing
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: timing-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: 'true'

databases:
  - name: timing-db
    plan: free
    region: frankfurt
    databaseName: timing
    user: timing
