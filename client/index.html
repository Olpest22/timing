<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тайминг</title>
    <script>
      // Палитра до первой отрисовки, чтобы страница не мигала другой палитрой
      try {
        var t = localStorage.getItem('timing.theme');
        if (t === 'day' || t === 'ink') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
